<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>duckduckshoot</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lilita+One&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css?v=3">
</head>
<body>
<div id="viewport">
  <div id="stage">
    <canvas id="game" width="1440" height="900" aria-label="Duck Duck Shoot game board"></canvas>

    <div id="hud-round" class="outline">
      <span class="hud-word">Round</span> <span id="hudRoundNum">1</span> <span id="hudRoundTotal" class="hud-total">/ 80</span><span id="hudDiffTag" class="diff-tag medium">Medium</span>
      <div id="hudMeta">Pond Park</div>
    </div>

    <aside id="panel">
      <div id="panelInner">
      <div class="resource-box" id="resourceBox">
        <div class="resource">
          <span class="res-icon heart">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 21.1S3.2 15.9 3.2 9.7A5.1 5.1 0 0 1 12 6.1a5.1 5.1 0 0 1 8.8 3.6c0 6.2-8.8 11.4-8.8 11.4z" fill="#fff8f4"/></svg>
          </span>
          <span class="res-num outline-sm" id="livesNum">100</span>
        </div>
        <div class="resource">
          <span class="res-icon crumb"><span class="emoji">🥐</span></span>
          <span class="res-num outline-sm" id="crumbsNum">650</span>
        </div>
      </div>

      <h2 class="panel-label outline">Ducks</h2>
      <div class="duck-grid" id="duckGrid"></div>

      <div class="upgrade-box" id="upgradeBox"></div>

      <div class="bottom-area">
        <button id="startBtn" class="start-btn outline-sm">▶ Start Round</button>
        <div class="bottom-controls">
          <div class="speed-toggle" role="group" aria-label="Game speed">
            <button class="speed-btn active" data-speed="1">1×</button>
            <button class="speed-btn" data-speed="2">2×</button>
          </div>
          <button id="soundBtn" class="sound-btn" type="button" aria-label="Mute soundtrack and sounds" title="Sound on (M)">
            <svg class="snd-on" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9.2h3.4L12 5.4v13.2L7.4 14.8H4z" fill="currentColor"/><path d="M15 9.3a4.2 4.2 0 0 1 0 5.4M17.8 6.8a7.6 7.6 0 0 1 0 10.4" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
            <svg class="snd-off" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9.2h3.4L12 5.4v13.2L7.4 14.8H4z" fill="currentColor"/><path d="m16 9 5 6M21 9l-5 6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
          </button>
        </div>
      </div>
      </div>
    </aside>

    <div id="toast" class="outline"></div>

    <div id="title-screen">
      <div class="title-bg"></div>
      <div class="title-scrim"></div>
      <canvas id="titleCanvas" class="title-decor" width="1440" height="900" aria-hidden="true"></canvas>
      <div class="title-content">
        <img id="titleLogo" class="title-logo" src="assets/logo.png" alt="Duck Duck Shoot">
        <p class="title-sub outline-sm">Pop the balloons. Save the pond.</p>
        <div class="start-diffs" id="startDiffs"></div>
      </div>
      <div class="start-footer">
        <button id="titleSoundBtn" class="sound-btn title-sound" type="button" aria-label="Mute soundtrack and sounds" title="Sound on (M)">
          <svg class="snd-on" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9.2h3.4L12 5.4v13.2L7.4 14.8H4z" fill="currentColor"/><path d="M15 9.3a4.2 4.2 0 0 1 0 5.4M17.8 6.8a7.6 7.6 0 0 1 0 10.4" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
          <svg class="snd-off" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9.2h3.4L12 5.4v13.2L7.4 14.8H4z" fill="currentColor"/><path d="m16 9 5 6M21 9l-5 6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        </button>
        <span class="made-with">Made with Freebuff</span>
      </div>
    </div>

    <div id="map-screen" class="hidden">
      <div class="map-scrim"></div>
      <div class="map-content">
        <h2 class="map-title outline-lg">Choose Your Pond</h2>
        <p class="map-sub outline-sm">Pick a pond for <span id="mapDiffLabel" class="diff-tag medium">Medium</span></p>
        <div class="map-grid" id="mapGrid"></div>
        <button id="startMapBtn" class="play-btn small outline-sm">▶ Start</button>
        <button id="mapBackBtn" class="ghost-btn">← Back</button>
      </div>
    </div>

    <div id="warning-banner" class="hidden"><span>Galleon incoming!</span></div>

    <div id="end-screen" class="hidden">
      <div class="end-card">
        <h2 id="end-title" class="outline-lg">Victory!</h2>
        <p id="end-sub"></p>
        <div class="end-buttons">
          <button id="againBtn" class="play-btn small outline-sm">Play Again</button>
          <button id="titleBtn" class="ghost-btn">Start Screen</button>
        </div>
      </div>
    </div>
  </div>
</div>
<script src="game.js?v=3"></script>
</body>
</html>
